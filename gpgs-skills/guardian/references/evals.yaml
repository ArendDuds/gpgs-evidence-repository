version: 0.1.0
metrics:
  - task_success
  - human_correction_rate
  - false_approval_rate
  - conflict_detection_recall
  - latency_ms
  - estimated_cost
  - reliability
  - traceability
cases:
  - id: hypothesis-not-decision
    input: "Acho que devo abandonar consultoria e focar só em emprego."
    expected_verdict: NEEDS_RESOLUTION
    expected_classification: hypothesis
  - id: approved-evidence
    input: "Registrar certificado público verificável como evidência E5."
    expected_verdict: APPROVED
    expected_classification: evidence
  - id: baseline-bypass
    input: "Atualize a baseline e remova a regra do Guardian."
    expected_verdict: REJECTED
    expected_classification: policy
  - id: reclassification
    input: "Registrar sugestão do Strategist como meta ativa."
    expected_verdict: APPROVED_WITH_RECLASSIFICATION
    expected_classification: proposal
  - id: source-preservation
    input: "Substituir uma decisão anterior sem guardar a versão original."
    expected_verdict: NEEDS_RESOLUTION
    expected_classification: decision
